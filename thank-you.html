<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Message Sent | InnovateX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#03020a;--em:#ff4500;--vi:#7c3aed;--text:#ede8ff;--muted:#5c5680}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:none}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#cur{position:fixed;width:8px;height:8px;background:var(--em);border-radius:50%;pointer-events:none;z-index:9999;mix-blend-mode:screen;transform:translate(-50%,-50%)}
.wrap{position:relative;z-index:2;text-align:center;padding:40px}
.check{width:80px;height:80px;border-radius:50%;background:rgba(255,69,0,0.08);border:1px solid rgba(255,69,0,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 36px;font-size:2rem;animation:popIn .6s cubic-bezier(.34,1.56,.64,1) .3s both}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(4rem,10vw,9rem);letter-spacing:.04em;line-height:.9;margin-bottom:20px;animation:slideUp .8s cubic-bezier(.16,1,.3,1) .5s both}
h1 em{font-style:normal;-webkit-text-stroke:2px var(--em);color:transparent}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
p{font-size:1.05rem;color:var(--muted);line-height:1.85;max-width:440px;margin:0 auto 40px;animation:slideUp .8s cubic-bezier(.16,1,.3,1) .7s both}
a{display:inline-block;padding:14px 32px;background:var(--em);color:#fff;font-family:'Outfit',sans-serif;font-weight:700;font-size:.9rem;text-decoration:none;letter-spacing:.04em;transition:transform .2s,box-shadow .2s;animation:slideUp .8s cubic-bezier(.16,1,.3,1) .9s both;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
a:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(255,69,0,.4)}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="grain"></div>
<div id="cur"></div>
<div class="wrap">
  <div class="check">✓</div>
  <h1>MESSAGE<br><em>RECEIVED.</em></h1>
  <p>We'll be in touch soon. Keep building — we look forward to having you in the InnovateX community.</p>
  <a href="./index.html">← Back to InnovateX</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Cursor
const cur=document.getElementById('cur');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'});
// Three.js bg
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
camera.position.z=6;
// Shell
const g=new THREE.IcosahedronGeometry(2.2,1);
const m=new THREE.MeshBasicMaterial({color:0xff4500,wireframe:true,transparent:true,opacity:.08});
const mesh=new THREE.Mesh(g,m); scene.add(mesh);
// Ring
const rg=new THREE.TorusGeometry(3,.005,4,140);
const rm=new THREE.MeshBasicMaterial({color:0xff4500,transparent:true,opacity:.25});
const ring=new THREE.Mesh(rg,rm);ring.rotation.x=Math.PI/2.2;scene.add(ring);
// Particles
const pN=600,pp=new Float32Array(pN*3);
for(let i=0;i<pN;i++){const r=4+Math.random()*8,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);pp[i*3]=r*Math.sin(ph)*Math.cos(th);pp[i*3+1]=r*Math.sin(ph)*Math.sin(th);pp[i*3+2]=r*Math.cos(ph)}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xff6b2b,size:.028,transparent:true,opacity:.65,sizeAttenuation:true}));
scene.add(pts);
let mmx=0,mmy=0;
document.addEventListener('mousemove',e=>{mmx=(e.clientX/innerWidth-.5)*2;mmy=-(e.clientY/innerHeight-.5)*2});
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();mesh.rotation.y+=.004;mesh.rotation.x+=.002;ring.rotation.z+=.005;pts.rotation.y+=.001;camera.position.x+=(mmx*.6-camera.position.x)*.04;camera.position.y+=(mmy*.4-camera.position.y)*.04;renderer.render(scene,camera)}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
